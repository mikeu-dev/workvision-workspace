[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workvision-schemas"
version = "0.1.0"
description = "Shared Pydantic data contracts for WorkVision AI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workvision_schemas*"]
