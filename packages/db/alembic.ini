# Package-local alembic configuration.

[alembic]
script_location = alembic
path_separator = os
file_template = %%(rev)s_%%(slug)s
version_locations = alembic/versions
sqlalchemy.url = postgresql+asyncpg://workvision:workvision_secret_2026@localhost:5432/workvision_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
