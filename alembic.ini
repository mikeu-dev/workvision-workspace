# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = packages/db/alembic
path_separator = os

# Template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a corresponding .py file to be detected
# sourceless = false

# Search path for version locations
version_locations = packages/db/alembic/versions

# The output encoding used when revisions are generated from script.py.mako
# output_encoding = utf-8

# sqlalchemy.url is dynamically overridden by env.py from workvision_config
sqlalchemy.url = postgresql+asyncpg://workvision:workvision_secret_2026@localhost:5432/workvision_db


[post_write_hooks]
# Post-write hooks define scripts or Python methods that are run on newly
# generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
