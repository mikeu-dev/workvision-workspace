services:
  postgres:
    image: postgres:15-alpine
    container_name: workvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workvision_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-workvision_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workvision} -d ${POSTGRES_DB:-workvision_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workvision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: workvision_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    command: ["uvicorn", "workvision_api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  vision-worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: workvision_vision_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    command: ["python", "-m", "workvision_worker.main"]

  event-processor:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    container_name: workvision_event_processor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    command: ["python", "-m", "workvision_processor.main"]

volumes:
  postgres_data:
  redis_data:
