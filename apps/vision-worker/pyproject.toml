[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workvision-worker"
version = "0.1.0"
description = "Vision Worker (RTSP Ingestion & YOLO Tracking) for WorkVision AI"
requires-python = ">=3.10"
dependencies = [
    "workvision-config",
    "workvision-schemas",
    "workvision-shared",
    "redis>=5.0.0",
]

[project.scripts]
workvision-worker = "workvision_worker.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workvision_worker*"]
