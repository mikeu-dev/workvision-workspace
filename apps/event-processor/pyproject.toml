[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workvision-processor"
version = "0.1.0"
description = "Event & State Processor for WorkVision AI"
requires-python = ">=3.10"
dependencies = [
    "workvision-config",
    "workvision-schemas",
    "workvision-shared",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.30",
    "shapely>=2.0.0",
]

[project.scripts]
workvision-processor = "workvision_processor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workvision_processor*"]
